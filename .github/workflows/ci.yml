name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # React is a devDependency only: the panel gets it from the Harness at runtime, the
      # tests need it to render the client tree outside DSH.
      - name: Install test renderer
        run: npm install --no-audit --no-fund

      - name: Unit and integration tests
        run: node test/run.mjs

      - name: Cold-start smoke test
        run: node test/smoke.mjs

      - name: Manifest is installable
        run: node -e "const p=require('./package.json');if(p.private)throw new Error('package is private');if(!p.dsh?.bundle?.patch)throw new Error('missing bundle patch');console.log(p.name+' '+p.version+' ready')"
